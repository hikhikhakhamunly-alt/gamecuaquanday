<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bắn Cá Anime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(180deg, #0a0e30 0%, #1a2a6c 50%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 80vh;
            max-width: 800px;
            max-height: 600px;
            background: linear-gradient(180deg, #001f3f 0%, #003366 50%, #001a33 100%);
            border: 3px solid #4a90e2;
            border-radius: 10px;
            overflow: hidden;
        }
        #header {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }
        #wallet {
            color: #ffd700;
        }
        #weapon {
            color: #00ff88;
        }
        #boss-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        #boss-hp {
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            width: 100%;
            transition: width 0.2s linear;
        }
        #submarine {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            background: #4a90e2;
            border-radius: 50% 50% 20% 20%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            z-index: 10;
        }
        #submarine::after {
            content: "🔫";
            font-size: 25px;
        }
        .fish {
            position: absolute;
            font-size: 30px;
            transition: left 0.5s linear, top 0.5s linear;
        }
        .boss {
            font-size: 50px;
            animation: boss-float 3s ease-in-out infinite;
        }
        @keyframes boss-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .bullet {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffff00;
            border-radius: 50%;
            z-index: 5;
        }
        .effect {
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            animation: float-up 1s ease-out forwards;
        }
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="weapon">Đạn cấp: 1</div>
        <div id="wallet">Xu: 100000</div>
    </div>
    <div id="boss-bar">
        <div id="boss-hp"></div>
    </div>
    <div id="game-container"></div>
    <div id="submarine"></div>

    <script>
        // Các loại cá phong cách anime, HP và giá trị thưởng
        const FISH_TYPES = [
            { emoji: '🐠', hp: 5, reward: 10, speed: 2 },
            { emoji: '🐟', hp: 10, reward: 25, speed: 1.5 },
            { emoji: '🐡', hp: 15, reward: 40, speed: 1 },
            { emoji: '🦈', hp: 30, reward: 100, speed: 1.2 },
            { emoji: '🐙', hp: 50, reward: 200, speed: 1 },
            { emoji: '🐳', hp: 100, reward: 500, speed: 0.8 },
            { emoji: '👹', isBoss: true, hp: 500, reward: 2000, speed: 0.5, emoji: '👹' }
        ];

        const gameContainer = document.getElementById('game-container');
        const walletEl = document.getElementById('wallet');
        const weaponEl = document.getElementById('weapon');
        const bossBar = document.getElementById('boss-bar');
        const bossHpEl = document.getElementById('boss-hp');
        const submarine = document.getElementById('submarine');

        let wallet = 100000;
        let weaponLevel = 1;
        let fishes = [];
        let bullets = [];
        let bossActive = false;
        let boss = null;

        // Cập nhật hiển thị
        function updateDisplay() {
            walletEl.textContent = `Xu: ${wallet.toLocaleString('vi-VN')}`;
            weaponEl.textContent = `Đạn cấp: ${weaponLevel}`;
        }

        // Tạo cá mới
        function spawnFish() {
            if (bossActive) return;
            // Chọn loại cá ngẫu nhiên, ít boss hơn
            const random = Math.random();
            let fishType;
            if (random < 0.05) {
                fishType = FISH_TYPES.find(f => f.isBoss);
            } else {
                fishType = FISH_TYPES[Math.floor(Math.random() * (FISH_TYPES.length - 1))];
            }

            const fish = document.createElement('div');
            fish.className = `fish ${fishType.isBoss ? 'boss' : ''}`;
            fish.textContent = fishType.emoji;
            fish.dataset.hp = fishType.hp;
            fish.dataset.reward = fishType.reward;
            fish.dataset.speed = fishType.speed;

            // Vị trí ban đầu
            fish.style.left = '-50px';
            fish.style.top = `${Math.random() * (gameContainer.offsetHeight - 50)}px`;
            
            gameContainer.appendChild(fish);
            fishes.push({ element: fish, ...fishType });

            // Di chuyển cá
            moveFish(fish);
        }

        // Di chuyển cá
        function moveFish(fish) {
            const speed = parseFloat(fish.dataset.speed);
            const moveInterval = setInterval(() => {
                const currentLeft = parseInt(fish.style.left);
                if (currentLeft > gameContainer.offsetWidth) {
                    // Cá đi ra ngoài, xóa
                    clearInterval(moveInterval);
                    fish.remove();
                    fishes = fishes.filter(f => f.element !== fish);
                    return;
                }
                fish.style.left = `${currentLeft + speed}px`;
            }, 30);
        }

        // Tạo đạn
        function createBullet() {
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            const submarineRect = submarine.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            
            bullet.style.left = `${submarineRect.left - containerRect.left + submarineRect.width/2}px`;
            bullet.style.top = `${submarineRect.top - containerRect.top - 20}px`;
            
            gameContainer.appendChild(bullet);
            bullets.push(bullet);
            moveBullet(bullet);
        }

        // Di chuyển đạn
        function moveBullet(bullet) {
            const moveInterval = setInterval(() => {
                const currentTop = parseInt(bullet.style.top);
                if (currentTop < 0) {
                    clearInterval(moveInterval);
                    bullet.remove();
                    bullets = bullets.filter(b => b !== bullet);
                    return;
                }
                bullet.style.top = `${currentTop - 8}px`;
                
                // Kiểm tra va chạm với cá
                checkCollision(bullet);
            }, 10);
        }

        // Kiểm tra va chạm
        function checkCollision(bullet) {
            const bulletRect = bullet.getBoundingClientRect();
            
            for (const fishObj of fishes) {
                const fishRect = fishObj.element.getBoundingClientRect();
                
                if (
                    bulletRect.left < fishRect.right &&
                    bulletRect.right > fishRect.left &&
                    bulletRect.top < fishRect.bottom &&
                    bulletRect.bottom > fishRect.top
                ) {
                    // Trừ HP cá
                    let currentHp = parseInt(fishObj.element.dataset.hp);
                    currentHp -= weaponLevel;
                    fishObj.element.dataset.hp = currentHp;
                    
                    // Hiệu ứng trúng đạn
                    createEffect(fishObj.element, '-${weaponLevel}');
                    
                    if (currentHp <= 0) {
                        // Cá chết, nhận thưởng
                        wallet += fishObj.element.dataset.reward;
                        createEffect(fishObj.element, '+${fishObj.element.dataset.reward}');
                        
                        fishObj.element.remove();
                        fishes = fishes.filter(f => f.element !== fishObj.element);
                    }
                    
                    // Xóa đạn sau va chạm
                    bullet.remove();
                    bullets = bullets.filter(b => b !== bullet);
                    break;
                }
            }

            // Kiểm tra va chạm với boss
            if (bossActive) {
                const bossRect = boss.getBoundingClientRect();
                if (
                    bulletRect.left < bossRect.right &&
                    bulletRect.right > bossRect.left &&
                    bulletRect.top < bossRect.bottom &&
                    bulletRect.bottom > bossRect.top
                ) {
                    let currentHp = parseInt(boss.dataset.hp);
                    currentHp -= weaponLevel * 5;
                    boss.dataset.hp = currentHp;
                    bossHpEl.style.width = `${currentHp / 500 * 100}%`;
                    
                    createEffect(boss, '-${weaponLevel *5}');
                    
                    if (currentHp <= 0) {
                        wallet += 2000;
                        createEffect(boss, '+2000');
                        boss.remove();
                        boss = null;
                        bossActive = false;
                        bossBar.style.display = 'none';
                    }
                    
                    bullet.remove();
                    bullets = bullets.filter(b => b !== bullet);
                }
            }
        }

        // Tạo hiệu ứng số bay lên
        function createEffect(target, text) {
            const effect = document.createElement('div');
            effect.className = 'effect';
            effect.textContent = text;
            effect.style.left = target.style.left;
            effect.style.top = target.style.top;
            effect.style.color = text.startsWith('+') ? '#00ff88' : '#ff4444';
            
            gameContainer.appendChild(effect);
            setTimeout(() => effect.remove(), 1000);
        }

        // Sự kiện bắn khi click tàu ngầm
        submarine.addEventListener('click', () => {
            createBullet();
            updateDisplay();
        });

        // Tạo cá định kỳ
        setInterval(() => {
            if (fishes.length < 15) {
                spawnFish();
            }
        }, 800);

        // Tự động bắn đạn định kỳ
        setInterval(() => {
            if (Math.random() < 0.7) {
                createBullet();
            }
        }, 300);

        // Kiểm tra sinh boss định kỳ
        setInterval(() => {
            if (!bossActive && Math.random() < 0.02) {
                const bossType = FISH_TYPES.find(f => f.isBoss);
                boss = document.createElement('div');
                boss.className = `fish boss`;
                boss.textContent = bossType.emoji;
                boss.dataset.hp = bossType.hp;
                boss.dataset.reward = bossType.reward;
                boss.dataset.speed = bossType.speed;
                
                boss.style.left = '-50px';
                boss.style.top = `${Math.random() * (gameContainer.offsetHeight - 100)}px`;
                
                gameContainer.appendChild(boss);
                bossActive = true;
                bossBar.style.display = 'block';
                bossHpEl.style.width = '100%';
                
                moveFish(boss);
            }
        }, 5000);

        // Khởi tạo
        updateDisplay();
    </script>
</body>
</html>
